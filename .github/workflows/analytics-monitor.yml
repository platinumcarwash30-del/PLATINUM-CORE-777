name: PLATINUM CORE 777 Analytics Monitor

on:
  # GitHub Actions cron is UTC; the job gates execution using Europe/Belgrade
  # so the three report hours remain correct across daylight-saving changes.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: social-autopilot-analytics-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-autopilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-autopilot/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Run only at 08:00, 15:00, or 21:00 Belgrade time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            npm run analytics-monitor:once
            exit 0
          fi
          local_hour="$(TZ=Europe/Belgrade date +%H)"
          case "$local_hour" in
            08|15|21)
              npm run analytics-monitor:once
              ;;
            *)
              echo "No analytics report scheduled for Europe/Belgrade hour ${local_hour}:00"
              ;;
          esac
        env:
          NODE_ENV: production
          NOTIFICATION_TO: platinum303030@gmail.com
          SMTP_HOST: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_PASSWORD }}
          SMTP_FROM: "PLATINUM CORE 777 <contact@platinumcore777.com>"
          SEARCH_CONSOLE_PROPERTY: sc-domain:platinumcore777.com
          GOOGLE_ANALYTICS_PROPERTY_ID: "554126635"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SOCIAL_AUTOPILOT_GOOGLE_SERVICE_ACCOUNT_JSON }}
