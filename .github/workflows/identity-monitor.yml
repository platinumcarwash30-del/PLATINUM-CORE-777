name: PLATINUM CORE 777 Public Identity Monitor

on:
  schedule:
    - cron: "0 4,5 * * *"
  workflow_dispatch:

concurrency:
  group: social-autopilot-identity-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  belgrade-time-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Belgrade date +%H)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$local_hour" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled check skipped outside 06:00 Europe/Belgrade."
          fi
  monitor:
    needs: belgrade-time-gate
    if: needs.belgrade-time-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-autopilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-autopilot/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Restore seven-day monitor state
        uses: actions/cache/restore@v4
        with:
          path: social-autopilot/identity-monitor-state.json
          key: identity-monitor-${{ github.run_id }}
          restore-keys: identity-monitor-

      - name: Run public identity monitor
        run: npm run identity-monitor:once
        env:
          NODE_ENV: production
          NOTIFICATION_TO: platinum303030@gmail.com
          SMTP_HOST: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_PASSWORD }}
          SMTP_FROM: "PLATINUM CORE 777 <platinumcarwash30@gmail.com>"
          BRAVE_SEARCH_API_KEY: ${{ secrets.SOCIAL_AUTOPILOT_BRAVE_SEARCH_API_KEY }}
          OFFICIAL_SOURCE_URLS: "https://platinumcore777.com/,https://github.com/platinumcarwash30-del/PLATINUM-CORE-777"
          IDENTITY_MONITOR_STATE_PATH: "./identity-monitor-state.json"

      - name: Keep monitor state for the next run
        if: always()
        run: test -f identity-monitor-state.json || echo '{}' > identity-monitor-state.json

      - name: Save seven-day monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: social-autopilot/identity-monitor-state.json
          key: identity-monitor-${{ github.run_id }}
