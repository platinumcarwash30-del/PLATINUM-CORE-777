name: PLATINUM CORE 777 Wikipedia Draft Monitor

on:
  schedule:
    - cron: "0 4,5 * * *"
  workflow_dispatch:

concurrency:
  group: social-autopilot-wikipedia-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  belgrade-time-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Belgrade date +%H)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$local_hour" == "06" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled check skipped outside 06:00 Europe/Belgrade."
          fi
  run-once:
    needs: belgrade-time-gate
    if: needs.belgrade-time-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-autopilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-autopilot/package-lock.json

      - uses: actions/cache/restore@v4
        with:
          path: social-autopilot/wikipedia-draft-state.json
          key: wikipedia-draft-${{ github.run_id }}
          restore-keys: |
            wikipedia-draft-

      - run: npm ci
      - run: npm run build
      - name: Create draft output directory
        run: mkdir -p ../docs/wikipedia

      - run: npm run wikipedia-draft:once
        env:
          NODE_ENV: production
          WIKIPEDIA_DRAFT_SITE_URL: https://platinumcore777.com/
          WIKIPEDIA_DRAFT_SITEMAP_URL: https://platinumcore777.com/sitemap.xml
          WIKIPEDIA_DRAFT_STATE_PATH: ./wikipedia-draft-state.json
          WIKIPEDIA_DRAFT_PATH: ../docs/wikipedia/PLATINUM-CORE-777-draft.md
          WIKIPEDIA_DRAFT_SOURCES_PATH: ../docs/wikipedia/PLATINUM-CORE-777-sources.md
      - name: Email copy-ready Wikipedia draft and sources
        env:
          SMTP_HOST: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_HOST }}
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SOCIAL_AUTOPILOT_SMTP_PASSWORD }}
          SMTP_FROM: "PLATINUM CORE 777 <contact@platinumcore777.com>"
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const nodemailer = require("nodemailer");
          const draft = fs.readFileSync("../docs/wikipedia/PLATINUM-CORE-777-draft.md", "utf8").trim();
          const sources = fs.readFileSync("../docs/wikipedia/PLATINUM-CORE-777-sources.md", "utf8").trim();
          if (!draft || !sources) throw new Error("Wikipedia draft or source list is empty");
          (async () => {
            const transporter = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: Number(process.env.SMTP_PORT || 587),
              secure: process.env.SMTP_SECURE === "true",
              auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASSWORD },
            });
            await transporter.sendMail({
              from: process.env.SMTP_FROM,
              to: "platinum303030@gmail.com",
              subject: "[PLATINUM CORE 777] Wikipedia tekst za kopiranje",
              text: [
                "Wikipedia nacrt za ručni pregled i kopiranje:",
                "",
                draft,
                "",
                "IZVORI:",
                "",
                sources,
                "",
                "Ovo je nacrt za tvoj pregled; nije objavljen na Wikipediji.",
                "Akcija: https://github.com/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID
              ].join("\n"),
            });
            console.log("Copy-ready Wikipedia draft emailed to the owner.");
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Save draft progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: social-autopilot/wikipedia-draft-state.json
          key: wikipedia-draft-${{ github.run_id }}

      - name: Upload review-only research packet
        uses: actions/upload-artifact@v4
        with:
          name: platinum-core-777-wikipedia-research-${{ github.run_number }}
          path: |
            docs/wikipedia/PLATINUM-CORE-777-draft.md
            docs/wikipedia/PLATINUM-CORE-777-sources.md
          if-no-files-found: error
          retention-days: 14
