services:
  - type: web
    name: platinum-core-777-social-autopilot
    runtime: docker
    dockerfilePath: ./social-autopilot/Dockerfile
    dockerContext: ./social-autopilot
    plan: starter
    healthCheckPath: /health
    disk:
      name: autopilot-data
      mountPath: /var/lib/social-autopilot
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/lib/social-autopilot/autopilot.sqlite
      - key: SITE_SITEMAP_URL
        value: https://platinumcore777.com/sitemap.xml
      - key: RUN_INTERVAL_MINUTES
        value: "1440"
      - key: NOTIFICATION_TO
        value: platinum303030@gmail.com
      - key: ADMIN_USERNAME
        value: marko
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "PLATINUM CORE 777 <contact@platinumcore777.com>"
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_ORGANIZATION_ID
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: RUN_ON_START
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: WHYDONATE_URL
        sync: false
      - key: BUYMEACOFFEE_URL
        sync: false
      - key: PORT
        value: "3000"
